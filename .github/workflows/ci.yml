name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine
          python -m pip check

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src tests benchmarks

      - name: Tests
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Verify installed wheel and GUI assets outside checkout
        run: |
          python -c "import glob, subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--target', '.smoke_wheel_install', glob.glob('dist/*.whl')[0]], check=True)"
          python benchmarks/verify_distribution.py dist .smoke_wheel_install

      - name: Compile package
        run: python -m compileall -q src
